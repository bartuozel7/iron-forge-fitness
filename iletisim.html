
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İletişim | Iron Forge Fitness</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #333;
            color: white;
            box-sizing: border-box;
        }
        .submit-btn {
            background-color: #ff4500;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .submit-btn:hover {
            background-color: #cc3700;
        }
    </style>
</head>
<body>
    <header>
        <h1>Iron Forge Fitness</h1>
    </header>

    <nav>
        <a href="index.html">Anasayfa</a>
        <a href="hakkimizda.html">Hakkımızda</a>
        <a href="medya.html">Medya & Program</a>
        <a href="iletisim.html">İletişim</a>
    </nav>

    <div class="container">
        <h2 style="color: #ff4500;">Bizimle İletişime Geçin</h2>
        
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <p>Üyelik bilgileri, kişisel antrenörlük ve diğer sorularınız için formu doldurun.</p>
            
            <!-- E-posta Gönderme Formu (FormSubmit altyapısı ile) -->
            <!-- NOT: action kısmındaki URL, formun doğrudan email atmasını sağlar -->
            <form action="https://formsubmit.co/senin_email_adresin@gmail.com" method="POST">
                
                <!-- Spami engellemek için gizli alan -->
                <input type="hidden" name="_captcha" value="false">
                <!-- Başarılı gönderim sonrası yönlendirilecek sayfa (isteğe bağlı, şu an kapalı) -->
                <!-- <input type="hidden" name="_next" value="https://seninsiten.com/tesekkurler.html"> -->

                <div class="form-group">
                    <label for="name">Adınız Soyadınız:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">E-posta Adresiniz:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="subject">Konu:</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Mesajınız:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Mesajı Gönder</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Iron Forge Fitness. Tüm Hakları Saklıdır.</p>
    </footer>
</body>
</html>
